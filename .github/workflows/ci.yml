name: ci
on:
  push:
    branches: [redesign/v2, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build precedes the tests because two suites assert against the built
      # output (dist/client/rss.xml and dist/client/index.html). With the old
      # order those assertions either failed outright or skipped silently,
      # which is how a vacuous homepage check survived several green runs.
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Check every outbound link resolves
        # idowuseyi.dev is skipped only until the DNS cutover makes it live
        # (a later plan item) — until then the canonical/og/sitemap links to
        # it are a known-good failure from linkinator's point of view, not a
        # defect in this build.
        run: npx --yes linkinator ./dist/client --recurse --silent --skip "linkedin.com,idowuseyi.dev,medium.com"
      - name: Performance budget
        # ubuntu-latest already ships Chrome; @lhci/cli drives it directly, so
        # no browser install step is added here. --no-sandbox (set in
        # lighthouserc.json's chromeFlags) is required because the Actions
        # runner executes as root.
        # Fetched on demand rather than declared as a devDependency: its
        # Lighthouse/Puppeteer tree carries 14 high-severity advisories that are
        # not exploitable here (dev-only, trusted inputs) but have no patched
        # release, and leaving them in the lockfile makes `npm audit` unreadable.
        run: npx --yes @lhci/cli@0.15.1 autorun
